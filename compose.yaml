services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: lab-db-only
      MARIADB_ROOT_PASSWORD: lab-root-only
    ports:
      - '127.0.0.1:${LAB_DB_PORT:-3307}:3306'
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 5s
      retries: 40
  wordpress:
    image: wordpress:php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${LAB_PORT:-8080}:80'
    environment: &wp_environment
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: lab-db-only
      WORDPRESS_TABLE_PREFIX: wml_
      WORDPRESS_DEBUG: '1'
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('DISABLE_WP_CRON', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_ENVIRONMENT_TYPE', 'local');
    volumes:
      - site:/var/www/html
  cli:
    image: wordpress:cli-php8.3
    user: '33:33'
    profiles: ['tools']
    environment:
      <<: *wp_environment
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes:
      - site:/var/www/html
      - ./:/lab:ro
      - ./artifacts:/artifacts
    working_dir: /var/www/html
  ssh:
    profiles: ['ssh']
    build: ./ssh
    ports:
      - '127.0.0.1:2222:22'
    volumes:
      - ./.runtime/ssh:/keys:ro
volumes:
  database:
  site:
